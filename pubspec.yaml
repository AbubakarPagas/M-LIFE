dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# sqlite3_flutter_libs 0.6.0+eol uses the jni/cnativeapi packages to load
# the native SQLite library, which crashes with "JNI is not initialized" on
# Android when Dart code runs before the Flutter engine is fully started.
# The 0.5.x series uses a straightforward dlopen approach with no JNI dependency.
dependency_overrides:
  sqlite3_flutter_libs: 0.5.42
flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - assets/images/collections/
    - assets/json/
    - assets/svg/hijri/
    - assets/svg/collection/
    - assets/svg/
    - assets/adhan_times/
    - assets/svg/surah_name/
    - assets/svg/alwaqf/
    - assets/json/translate/
    - assets/lottie/
    - assets/locales/
    - assets/json/azkar.json

  fonts:
    - family: uthmanic
      fonts:
        - asset: assets/fonts/UthmanTN1_Ver10.otf

    - family: uthmanic2
      fonts:
        - asset: assets/fonts/UthmanicHafs_V20.ttf

    - family: kufi
      fonts:
        - asset: assets/fonts/Kufam-Italic-VariableFont_wght.ttf
          style: italic
        - asset: assets/fonts/Kufam-VariableFont_wght.ttf
          weight: 500
        - asset: assets/fonts/Kufam-Regular.ttf
          weight: 100

    - family: naskh
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-VariableFont_wght.ttf
    - family: ayahNumber
      fonts:
        - asset: assets/fonts/Uthmanic_NeoCOLORD-Regular.ttf

    - family: urdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu.ttf

    - family: bn
      fonts:
        - asset: assets/fonts/NotoSerifBengali.ttf

    - family: playpen
      fonts:
        - asset: assets/fonts/Playpen_Sans_Arabic/PlaypenSansArabic-ExtraLight.ttf
          weight: 100
        - asset: assets/fonts/Playpen_Sans_Arabic/PlaypenSansArabic-Light.ttf
          weight: 200
        - asset: assets/fonts/Playpen_Sans_Arabic/PlaypenSansArabic-Regular.ttf
          weight: 300
        - asset: assets/fonts/Playpen_Sans_Arabic/PlaypenSansArabic-Medium.ttf
          weight: 400
        - asset: assets/fonts/Playpen_Sans_Arabic/PlaypenSansArabic-Bold.ttf
          weight: 700

    - family: thmanyah
      fonts:
        - asset: assets/fonts/Thmanyah_Sans/thmanyahsans-Light.otf
          weight: 300
        - asset: assets/fonts/Thmanyah_Sans/thmanyahsans-Regular.otf
          weight: 400
        - asset: assets/fonts/Thmanyah_Sans/thmanyahsans-Medium.otf
          weight: 500
        - asset: assets/fonts/Thmanyah_Sans/thmanyahsans-Bold.otf
          weight: 700
